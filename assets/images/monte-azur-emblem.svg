<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none" aria-label="Monte Azur Emblem">
  <!--
    MONTE AZUR — LUXURY ARCHITECTURAL EMBLEM (FAVICON / EMBLEM MARK)
  -->
  <defs>
    <linearGradient id="emblemGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C76B" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#997A1E" />
    </linearGradient>
    <linearGradient id="emblemSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#DCD6CC" />
    </linearGradient>
  </defs>

  <!-- Outer Architectural Diamond Boundary -->
  <path d="M32 3 L61 32 L32 61 L3 32 Z" 
        stroke="url(#emblemGoldGrad)" 
        stroke-width="1.2" 
        stroke-opacity="0.4" 
        stroke-dasharray="1.5 2" 
        fill="none" />

  <!-- Escarpment Peak ('Monte') -->
  <path d="M14 43 L32 15 L50 43" 
        stroke="url(#emblemGoldGrad)" 
        stroke-width="2.2" 
        stroke-linecap="round" 
        stroke-linejoin="round" 
        fill="none" />

  <!-- Pavilion Vertical Solstice Spire -->
  <line x1="32" y1="11" x2="32" y2="47" 
        stroke="url(#emblemGoldGrad)" 
        stroke-width="1.6" 
        stroke-linecap="round" />

  <!-- Ocean Horizon Arc ('Azur') -->
  <path d="M16 38 C22 47, 42 47, 48 38" 
        stroke="url(#emblemSilverGrad)" 
        stroke-width="1.8" 
        stroke-linecap="round" 
        stroke-opacity="0.9" 
        fill="none" />

  <!-- Waterline Grounding -->
  <line x1="22" y1="49" x2="42" y2="49" 
        stroke="url(#emblemGoldGrad)" 
        stroke-width="1.4" 
        stroke-opacity="0.8" 
        stroke-linecap="round" />

  <!-- Star / Sun Apex -->
  <circle cx="32" cy="28" r="2" fill="#FFFFFF" />
</svg>
